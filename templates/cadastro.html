<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - Dragon Bot</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161a23; padding: 40px; border-radius: 20px; border: 1px solid #00ff88; width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 12px 0; border-radius: 10px; border: 1px solid #333; background: #0b0e14; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 16px; background: #00ff88; color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#00ff88">Finalizar Cadastro</h2>
        <p>Use o mesmo e-mail da compra na Kirvano.</p>
        
        <form action="/cadastro" method="POST">
            <input type="email" name="email" placeholder="Seu Melhor E-mail" required>
            <input type="password" name="password" placeholder="Crie uma Senha Forte" required>
            <button type="submit">CRIAR MEU ACESSO</button>
        </form>
    </div>
</body>
</html>
