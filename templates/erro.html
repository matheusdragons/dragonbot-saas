<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Erro - Dragon Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0e14; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #161a23; padding: 50px; border-radius: 20px; text-align: center; max-width: 450px; border: 1px solid #2d333f; }
        .emoji { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #ff4757; margin-bottom: 15px; }
        p { color: #888; margin-bottom: 30px; line-height: 1.6; }
        a { display: inline-block; padding: 15px 30px; background: #00d9ff; color: black; text-decoration: none; border-radius: 8px; font-weight: bold; }
        a:hover { background: #00ff88; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">😕</div>
        <h1>Ops!</h1>
        <p>{{ mensagem }}</p>
        <a href="{{ botao_link }}">{{ botao_texto }}</a>
    </div>
</body>
</html>
