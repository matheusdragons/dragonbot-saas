<script>
        let ws;
        let conectado = false, roboLigado = false, operacaoEmCurso = false;
        let wins = 0, losses = 0, lucroTotal = 0.0;
        let stakeAtual = 1.0;
        let ultimoContratoId = null;

        function conectarAgora() {
            const token = document.getElementById('token_input').value.trim();
            if (!token) return alert("Insira o Token!");
            
            if(ws) ws.close(); // Fecha conexão anterior se houver
            ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            ws.onopen = () => ws.send(JSON.stringify({ "authorize": token }));

            ws.onmessage = (msg) => {
                const res = JSON.parse(msg.data);
                
                // 1. Tratamento de Erros
                if (res.error) {
                    escreverLog(`<span style="color:red">ERRO: ${res.error.message}</span>`);
                    operacaoEmCurso = false; 
                    return;
                }
                
                // 2. Autorização e Inscrição
                if (res.msg_type === "authorize") {
                    conectado = true;
                    document.getElementById('status_display').innerHTML = "Status: Online 🟢";
                    escreverLog("CONTA CONECTADA!");
                    ws.send(JSON.stringify({ "balance": 1, "subscribe": 1 }));
                    ws.send(JSON.stringify({ "ticks": "R_100", "subscribe": 1 }));
                    ws.send(JSON.stringify({ "proposal_open_contract": 1, "subscribe": 1 }));
                }

                // 3. Atualização de Saldo
                if (res.balance) {
                    document.getElementById('balance_display').innerText = res.balance.balance.toFixed(2) + " USD";
                }

                // 4. Lógica de Ticks (O Coração do Robô)
                if (res.tick) {
                    const p = res.tick.quote;
                    document.getElementById('preco').innerText = p;
                    
                    // Só entra se: Robô ON, Não houver operação e o dígito for 7
                    if (roboLigado && !operacaoEmCurso && p.toString().slice(-1) === "7") {
                        fazerEntrada();
                    }
                }

                // 5. Processamento de Resultado (Onde estava travando)
                if (res.proposal_open_contract) {
                    const c = res.proposal_open_contract;
                    
                    // Verifica se o contrato finalizou e se ainda não processamos este ID
                    if (c.is_completed === 1 && c.contract_id !== ultimoContratoId) {
                        ultimoContratoId = c.contract_id;
                        
                        const lucro = parseFloat(c.profit);
                        const stakeInicial = parseFloat(document.getElementById('stake_input').value);
                        const gale = parseFloat(document.getElementById('mult_input').value);
                        const est = document.getElementById('estrategia_input').value;

                        // Atualiza Contadores
                        if (lucro > 0) {
                            wins++;
                            escreverLog(`<span class="win">GANHOU: +$${lucro.toFixed(2)}</span>`);
                            stakeAtual = (est === "soros") ? Number((stakeAtual + lucro).toFixed(2)) : stakeInicial;
                        } else {
                            losses++;
                            escreverLog(`<span class="loss">PERDEU: -$${Math.abs(lucro).toFixed(2)}</span>`);
                            stakeAtual = (est === "martingale") ? Number((stakeAtual * gale).toFixed(2)) : stakeInicial;
                        }
                        
                        lucroTotal += lucro;
                        
                        // ATUALIZAÇÃO IMEDIATA DO PAINEL
                        document.getElementById('wins_display').innerText = wins;
                        document.getElementById('losses_display').innerText = losses;
                        const pnl = document.getElementById('profit_display');
                        pnl.innerText = lucroTotal.toFixed(2);
                        pnl.className = lucroTotal >= 0 ? "stat-value win" : "stat-value loss";
                        
                        // LIBERA PARA A PRÓXIMA ENTRADA
                        setTimeout(() => { operacaoEmCurso = false; }, 500); 
                    }
                }
            };
        }

        function fazerEntrada() {
            const stopWin = parseFloat(document.getElementById('stopWin_input').value);
            const stopLoss = parseFloat(document.getElementById('stopLoss_input').value);

            if (lucroTotal >= stopWin) { alertaFinal("🏆 META BATIDA!", "win"); pararBot(); return; }
            if (lucroTotal <= (stopLoss * -1)) { alertaFinal("🚫 STOP LOSS!", "loss"); pararBot(); return; }

            operacaoEmCurso = true; // Trava para não fazer entradas duplas no mesmo tick
            
            ws.send(JSON.stringify({
                "buy": 1, 
                "price": stakeAtual,
                "parameters": {
                    "amount": stakeAtual, 
                    "basis": "stake", 
                    "contract_type": "DIGITDIFF",
                    "currency": "USD", 
                    "duration": 1, 
                    "duration_unit": "t", 
                    "symbol": "R_100", 
                    "barrier": "7"
                }
            }));
            escreverLog(`Entrada enviada: $${stakeAtual.toFixed(2)}`);
        }

        function toggleRobo() {
            if (!conectado) return alert("Conecte primeiro!");
            roboLigado = !roboLigado;
            const btn = document.getElementById('btnAuto');
            btn.innerText = roboLigado ? "Parar Robô" : "Ligar Modo Automático";
            btn.classList.toggle('ligado', roboLigado);
            if (roboLigado) {
                document.getElementById('alerta_resultado').style.display = 'none';
                stakeAtual = parseFloat(document.getElementById('stake_input').value);
                operacaoEmCurso = false; 
                escreverLog("MODO AUTOMÁTICO LIGADO");
            }
        }

        function resetarSessao() {
            wins = 0; losses = 0; lucroTotal = 0.0;
            ultimoContratoId = null;
            operacaoEmCurso = false;
            document.getElementById('wins_display').innerText = "0";
            document.getElementById('losses_display').innerText = "0";
            document.getElementById('profit_display').innerText = "0.00";
            escreverLog("Sessão resetada.");
        }

        function alertaFinal(msg, tipo) {
            const box = document.getElementById('alerta_resultado');
            box.style.display = 'block';
            box.innerText = msg;
            box.style.border = `2px solid ${tipo === 'win' ? 'var(--success)' : 'var(--danger)'}`;
            box.style.color = tipo === 'win' ? 'var(--success)' : 'var(--danger)';
        }

        function pararBot() {
            roboLigado = false;
            const btn = document.getElementById('btnAuto');
            btn.innerText = "Ligar Modo Automático";
            btn.classList.remove('ligado');
        }

        function escreverLog(t) {
            const log = document.getElementById('log');
            log.innerHTML = `<div>> ${t}</div>` + log.innerHTML;
        }
    </script>
