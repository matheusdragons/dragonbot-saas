<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SaaS Bot Pro - Dashboard</title>
    <style>
        :root { --primary: #00d9ff; --success: #00ff88; --danger: #ff4444; --bg: #0b0e14; --card: #161a23; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0; }
        .header { width: 100%; height: 80px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid #2d333f; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .sidebar { width: 320px; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2d333f; }
        .main-panel { flex: 1; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2d333f; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-auth { background: var(--primary); color: #000; }
        .btn-bot { background: #ffaa00; color: #000; }
        .btn-bot.active { background: var(--danger); color: #fff; }
        #preco { font-size: 4em; color: var(--success); font-family: monospace; margin: 20px 0; }
        #log { background: #000; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; margin-top: 15px; text-align: left; border: 1px solid #222; }
        .win { color: var(--success); } .loss { color: var(--danger); }
    </style>
</head>
<body>
    <header class="header">
        <img src="/static/logo.jpg" alt="Logo" style="height:50px" onerror="this.src='https://via.placeholder.com/150x50?text=DragonBot'">
        <div id="status">Servidor: Desconectado 🔴</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="input-group"><label>Token Deriv</label><input type="password" id="token"></div>
            <div class="input-group"><label>Stake ($)</label><input type="number" id="stake" value="1.00"></div>
            <div class="input-group">
                <label>Estratégia</label>
                <select id="estrategia"><option value="martingale">Martingale</option><option value="fixo">Mão Fixa</option></select>
            </div>
            <button class="btn btn-auth" onclick="autenticar()">CONECTAR CONTA</button>
            <button id="btnBot" class="btn btn-bot" onclick="toggleBot()">LIGAR ROBÔ</button>
        </div>

        <div class="main-panel">
            <div style="background:#000; padding:15px; border-radius:10px; border:1px solid var(--primary);">
                <small>SALDO ATUAL</small>
                <div id="balance" style="font-size:24px; font-weight:bold; color:var(--primary);">0.00 USD</div>
            </div>
            <div id="preco">0.0000</div>
            <div style="display:flex; justify-content:space-around;">
                <div>WINS: <span id="wins" class="win">0</span></div>
                <div>LOSSES: <span id="losses" class="loss">0</span></div>
                <div>LUCRO: <span id="profit">0.00</span></div>
            </div>
            <div id="log">Aguardando servidor...</div>
        </div>
    </div>

    <script>
        let ws;
        let conectado = false, botLigado = false, operando = false;
        let wins = 0, losses = 0, lucro = 0.0, stakeAtual = 1.0;
        let ultimoId = null;

        function conectar() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                document.getElementById('status').innerHTML = "Servidor: Online 🟢";
                escreverLog("Conectado ao servidor SaaS.");
            };

            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);

                if(d.authorize) {
                    conectado = true;
                    escreverLog("CONTA AUTORIZADA!", "#00ff88");
                    ws.send(JSON.stringify({action: "watch"}));
                }

                if(d.balance) document.getElementById('balance').innerText = d.balance.balance.toFixed(2) + " USD";

                if(d.tick) {
                    const p = d.tick.quote;
                    document.getElementById('preco').innerText = p;
                    if(botLigado && !operando && p.toString().slice(-1) === "7") fazerEntrada();
                }

                if(d.proposal_open_contract && d.proposal_open_contract.is_completed) {
                    const c = d.proposal_open_contract;
                    if(c.contract_id !== ultimoId) {
                        ultimoId = c.contract_id;
                        processarResultado(c);
                    }
                }
            };
        }

        conectar();

        function autenticar() {
            const t = document.getElementById('token').value;
            ws.send(JSON.stringify({action: "auth", token: t}));
        }

        function fazerEntrada() {
            operando = true;
            ws.send(JSON.stringify({action: "buy", stake: stakeAtual}));
            escreverLog(`Entrada enviada: $${stakeAtual}`);
        }

        function processarResultado(c) {
            const p = parseFloat(c.profit);
            const base = parseFloat(document.getElementById('stake').value);
            
            if(p > 0) {
                wins++;
                escreverLog(`GANHOU: +$${p}`, "#00ff88");
                stakeAtual = base;
            } else {
                losses++;
                escreverLog(`PERDEU: -$${Math.abs(p)}`, "#ff4444");
                if(document.getElementById('estrategia').value === "martingale") stakeAtual *= 2.1;
            }
            lucro += p;
            document.getElementById('wins').innerText = wins;
            document.getElementById('losses').innerText = losses;
            document.getElementById('profit').innerText = lucro.toFixed(2);
            operando = false;
        }

        function toggleBot() {
            if(!conectado) return alert("Conecte primeiro!");
            botLigado = !botLigado;
            const b = document.getElementById('btnBot');
            b.innerText = botLigado ? "PARAR ROBÔ" : "LIGAR ROBÔ";
            b.classList.toggle('active', botLigado);
            if(botLigado) {
                stakeAtual = parseFloat(document.getElementById('stake').value);
                operando = false;
            }
        }

        function escreverLog(m, c="white") {
            const l = document.getElementById('log');
            l.innerHTML = `<div style="color:${c}">> ${m}</div>` + l.innerHTML;
        }
    </script>
</body>
</html>
