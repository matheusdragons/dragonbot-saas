<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dragon Bot V1 - Trader Pro</title>
    <style>
        :root { --primary: #00d9ff; --success: #00ff88; --danger: #ff4444; --bg: #0b0e14; --card: #161a23; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .header { width: 100%; height: 80px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box; border-bottom: 1px solid #2d333f; }
        .container { display: flex; gap: 20px; max-width: 1250px; margin: 20px auto; padding: 0 20px; }
        .sidebar { width: 350px; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #2d333f; }
        .main-panel { flex: 1; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #2d333f; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0b0e14; color: white; box-sizing: border-box; }
        .saldo-container { background: #0b0e14; padding: 20px; border-radius: 15px; border: 2px solid var(--primary); text-align: center; margin-bottom: 20px; }
        .saldo-valor { font-size: 36px; font-weight: bold; color: var(--primary); font-family: monospace; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1f242e; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        .win { color: var(--success); } .loss { color: var(--danger); }
        button { width: 100%; padding: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; border: none; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        .btn-verde { background: var(--success); color: #000; }
        .btn-auto { background: #ffaa00; color: white; }
        .btn-auto.ligado { background: var(--danger); }
        #preco { font-size: 5em; color: var(--success); text-align: center; font-weight: 900; margin: 20px 0; font-family: monospace; }
        #log { background: #000; border-radius: 10px; padding: 15px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #222; }
    </style>
</head>
<body>
    <header class="header">
        <div style="color: var(--primary); font-weight: bold; font-size: 20px;">DRAGON BOT V1</div>
        <div id="status_display">Status: Desconectado 🔴</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="input-group">
                <label>Token API Deriv</label>
                <input type="password" id="token_input" placeholder="Insira seu Token">
            </div>
            <div class="input-group">
                <label>Entrada (Stake)</label>
                <input type="number" id="stake_input" value="1.00" step="0.10">
            </div>
            <div class="input-group">
                <label>Estratégia</label>
                <select id="estrategia_input">
                    <option value="martingale">Martingale</option>
                    <option value="soros">Soros</option>
                </select>
            </div>
            <div class="input-group">
                <label>Mult. Martingale</label>
                <input type="number" id="mult_input" value="2.1" step="0.1">
            </div>
            <button class="btn-verde" onclick="conectarAgora()">CONECTAR CONTA</button>
            <button id="btnAuto" class="btn-auto" onclick="toggleRobo()">LIGAR MODO AUTOMÁTICO</button>
        </div>

        <div class="main-panel">
            <div class="saldo-container">
                <div id="balance_display" class="saldo-valor">0.00 USD</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">WINS: <span id="wins_display" class="win">0</span></div>
                <div class="stat-card">LOSSES: <span id="losses_display" class="loss">0</span></div>
            </div>
            <div id="preco">0.0000</div>
            <div id="log">Aguardando login...</div>
        </div>
    </div>

    <script>
        let ws;
        let conectado = false, roboLigado = false, operacaoEmCurso = false;
        let wins = 0, losses = 0, lucroTotal = 0.0, stakeAtual = 1.0;
        let historicoContratos = new Set();

        function initWS() {
            // CONEXÃO DIRETA COM O SERVIDOR DA DERIV (WSS)
            ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            ws.onopen = () => {
                escreverLog("Conexão estabelecida. Insira seu Token.");
            };

            ws.onmessage = (event) => {
                const res = JSON.parse(event.data);
                
                if (res.authorize) {
                    conectado = true;
                    document.getElementById('status_display').innerHTML = "Status: Online 🟢";
                    escreverLog("AUTORIZADO COM SUCESSO!");
                    ws.send(JSON.stringify({ "ticks": "R_100", "subscribe": 1 }));
                    ws.send(JSON.stringify({ "balance": 1, "subscribe": 1 }));
                }

                if (res.balance) {
                    document.getElementById('balance_display').innerText = res.balance.balance.toFixed(2) + " USD";
                }

                if (res.tick) {
                    let p = res.tick.quote.toString();
                    let ultimoDigito = p.slice(-1);
                    document.getElementById('preco').innerText = res.tick.quote;

                    // LÓGICA DE ENTRADA: DÍGITO 7
                    if (roboLigado && !operacaoEmCurso && ultimoDigito === "7") {
                        escreverLog("Estratégia: Dígito 7 detectado! Comprando...");
                        executarCompra();
                    }
                }

                if (res.buy) {
                    escreverLog("Ordem enviada! ID: " + res.buy.contract_id);
                }

                if (res.proposal_open_contract) {
                    let c = res.proposal_open_contract;
                    if (c.is_completed && !historicoContratos.has(c.contract_id)) {
                        historicoContratos.add(c.contract_id);
                        processarResultado(c);
                        operacaoEmCurso = false;
                    }
                }

                if (res.error) {
                    escreverLog(`<span class="loss">Erro: ${res.error.message}</span>`);
                    operacaoEmCurso = false;
                }
            };

            ws.onclose = () => {
                conectado = false;
                document.getElementById('status_display').innerHTML = "Status: Desconectado 🔴";
                setTimeout(initWS, 2000);
            };
        }

        function conectarAgora() {
            let tk = document.getElementById('token_input').value.trim();
            if(!tk) return alert("Insira seu Token API da Deriv!");
            ws.send(JSON.stringify({ authorize: tk }));
        }

        function executarCompra() {
            operacaoEmCurso = true;
            stakeAtual = parseFloat(document.getElementById('stake_input').value);
            
            ws.send(JSON.stringify({
                "buy": 1,
                "price": stakeAtual,
                "parameters": {
                    "amount": stakeAtual,
                    "basis": "stake",
                    "contract_type": "DIGITDIFF",
                    "currency": "USD",
                    "duration": 1,
                    "duration_unit": "t",
                    "symbol": "R_100",
                    "barrier": "7"
                }
            }));
        }

        function processarResultado(c) {
            let p = parseFloat(c.profit);
            if (p > 0) {
                wins++;
                escreverLog(`<span class="win">💰 WIN: +$${p.toFixed(2)}</span>`);
            } else {
                losses++;
                escreverLog(`<span class="loss">❌ LOSS: -$${Math.abs(p).toFixed(2)}</span>`);
            }
            atualizarPainel();
        }

        function atualizarPainel() {
            document.getElementById('wins_display').innerText = wins;
            document.getElementById('losses_display').innerText = losses;
        }

        function toggleRobo() {
            if(!conectado) return alert("Conecte a conta primeiro!");
            roboLigado = !roboLigado;
            let btn = document.getElementById('btnAuto');
            btn.innerText = roboLigado ? "PARAR ROBÔ" : "LIGAR MODO AUTOMÁTICO";
            btn.classList.toggle('ligado', roboLigado);
            if(roboLigado) escreverLog("MODO AUTOMÁTICO ATIVADO.");
        }

        function escreverLog(t) {
            const l = document.getElementById('log');
            l.innerHTML = `<div>> ${t}</div>` + l.innerHTML;
        }

        initWS();
    </script>
</body>
</html>
