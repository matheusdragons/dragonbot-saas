<script>
        let ws;
        let roboLigado = false, conectado = false;
        let operacaoEmCurso = false; 
        let wins = 0, losses = 0, lucroTotal = 0.0;
        let historicoContratos = new Set();
        let stakeAtual = 1.0;

        // Inicia a conexão DIRETA com a Deriv
        function initWS() {
            // Usamos o protocolo WSS (seguro) e o App ID padrão
            ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
            
            ws.onopen = () => {
                escreverLog("Conectado ao servidor da Deriv. Aguardando Token...");
            };

            ws.onmessage = (event) => handleMessage(JSON.parse(event.data));
            
            ws.onclose = () => {
                conectado = false;
                document.getElementById('status_display').innerHTML = "Status: Desconectado 🔴";
                setTimeout(initWS, 5000); // Tentativa de reconexão
            };
        }
        initWS();

        function handleMessage(res) {
            if (res.error) {
                if (res.error.code === 'AlreadySubscribed') return;
                escreverLog(`<span class="loss">Erro: ${res.error.message}</span>`);
                operacaoEmCurso = false;
                return;
            }

            // Resposta da Autenticação
            if (res.msg_type === "authorize") {
                conectado = true;
                document.getElementById('status_display').innerHTML = "Status: Online 🟢";
                escreverLog("CONTA CONECTADA COM SUCESSO!");
                
                // Subscreve nos fluxos de dados necessários
                ws.send(JSON.stringify({"balance": 1, "subscribe": 1}));
                ws.send(JSON.stringify({"ticks": "R_100", "subscribe": 1}));
                ws.send(JSON.stringify({"proposal_open_contract": 1, "subscribe": 1}));
            }

            if (res.balance) {
                document.getElementById('balance_display').innerText = res.balance.balance.toFixed(2) + " " + res.balance.currency;
            }

            if (res.tick) {
                let p = res.tick.quote;
                document.getElementById('preco').innerText = p;
                
                // Estratégia do Dígito 7 (vinda do seu main.py original)
                if (roboLigado && !operacaoEmCurso && p.toString().slice(-1) === "7") {
                    executarCompra();
                }
            }

            if (res.proposal_open_contract) {
                let c = res.proposal_open_contract;
                if ((c.is_completed || c.status !== "open") && !historicoContratos.has(c.contract_id)) {
                    historicoContratos.add(c.contract_id);
                    processarResultado(c);
                    operacaoEmCurso = false; 
                }
            }
        }

        function conectarAgora() {
            let tk = document.getElementById('token_input').value.trim();
            if(!tk) return alert("Insira seu Token!");
            // Envia o token para a Deriv
            ws.send(JSON.stringify({"authorize": tk}));
        }

        function executarCompra() {
            let winM = parseFloat(document.getElementById('stopWin_input').value);
            let lossM = parseFloat(document.getElementById('stopLoss_input').value);

            if (lucroTotal >= winM || lucroTotal <= (lossM * -1)) {
                exibirAlerta(lucroTotal >= winM ? 'win' : 'loss', lucroTotal >= winM ? '🏆 META ALCANÇADA!' : '🚫 STOP LOSS ATINGIDO!');
                pararBot(); return;
            }

            operacaoEmCurso = true; 
            // Payload de compra seguindo o padrão DIGITDIFF (Igual ao seu main.py)
            ws.send(JSON.stringify({
                "buy": 1,
                "price": parseFloat(stakeAtual),
                "parameters": {
                    "amount": parseFloat(stakeAtual),
                    "basis": "stake",
                    "contract_type": "DIGITDIFF",
                    "currency": "USD",
                    "duration": 1,
                    "duration_unit": "t",
                    "symbol": "R_100",
                    "barrier": "7"
                }
            }));
            escreverLog(`Entrada enviada: $${stakeAtual.toFixed(2)}`);
        }

        function processarResultado(c) {
            let p = parseFloat(c.profit) || 0;
            let inicial = parseFloat(document.getElementById('stake_input').value);
            let mult = parseFloat(document.getElementById('mult_input').value) || 2.1;
            let est = document.getElementById('estrategia_input').value;

            if (p > 0) {
                wins++;
                escreverLog(`<span class="win">💰 WIN: +$${p.toFixed(2)}</span>`);
                stakeAtual = (est === "soros") ? Number((inicial + p).toFixed(2)) : inicial;
            } else {
                losses++;
                escreverLog(`<span class="loss">❌ LOSS: -$${Math.abs(p).toFixed(2)}</span>`);
                if (est === "martingale") {
                    stakeAtual = Number((stakeAtual * mult).toFixed(2));
                } else {
                    stakeAtual = inicial;
                }
            }
            lucroTotal = Number((lucroTotal + p).toFixed(2));
            atualizarPainel();
        }

        function atualizarPainel() {
            document.getElementById('wins_display').innerText = wins;
            document.getElementById('losses_display').innerText = losses;
            let prof = document.getElementById('profit_display');
            prof.innerText = lucroTotal.toFixed(2);
            prof.className = lucroTotal >= 0 ? "win" : "loss";
        }

        function exibirAlerta(tipo, msg) {
            const el = document.getElementById('alerta_resultado');
            el.style.display = 'block';
            el.innerText = msg;
            el.style.background = tipo === 'win' ? 'rgba(0,255,136,0.1)' : 'rgba(255,68,68,0.1)';
            el.style.border = `2px solid ${tipo === 'win' ? 'var(--success)' : 'var(--danger)'}`;
            el.style.color = tipo === 'win' ? 'var(--success)' : 'var(--danger)';
        }

        function toggleRobo() {
            if(!conectado) return alert("Conecte a conta primeiro!");
            roboLigado = !roboLigado;
            let btn = document.getElementById('btnAuto');
            btn.innerText = roboLigado ? "PARAR ROBÔ" : "LIGAR MODO AUTOMÁTICO";
            btn.classList.toggle('ligado', roboLigado);
            if(roboLigado) {
                stakeAtual = parseFloat(document.getElementById('stake_input').value);
                operacaoEmCurso = false;
                document.getElementById('alerta_resultado').style.display = 'none';
                escreverLog("MODO AUTOMÁTICO ATIVADO");
            }
        }

        function resetarTudo() {
            if(roboLigado) return alert("Pare o robô antes.");
            wins = 0; losses = 0; lucroTotal = 0.0;
            historicoContratos.clear();
            atualizarPainel();
            escreverLog("Sessão Reiniciada.");
        }

        function pararBot() {
            roboLigado = false;
            let btn = document.getElementById('btnAuto');
            btn.innerText = "LIGAR MODO AUTOMÁTICO";
            btn.classList.remove('ligado');
        }

        function escreverLog(t) {
            const l = document.getElementById('log');
            const data = new Date().toLocaleTimeString();
            l.innerHTML = `<div><small style="color:#666">[${data}]</small> > ${t}</div>` + l.innerHTML;
        }
    </script>
