<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Trader - SaaS Bot</title>
    <style>
        :root { --primary: #00d9ff; --success: #00ff88; --danger: #ff4444; --bg: #0b0e14; --card: #161a23; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .header { height: 70px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid #2d333f; }
        .container { display: flex; gap: 20px; max-width: 1300px; margin: 20px auto; padding: 0 20px; }
        .sidebar { width: 340px; background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #2d333f; }
        .main { flex: 1; background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #2d333f; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; transition: 0.3s; }
        .btn-auth { background: var(--primary); color: #000; }
        .btn-start { background: var(--success); color: #000; }
        .btn-start.active { background: var(--danger); color: #fff; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { background: #0b0e14; padding: 15px; border-radius: 10px; border: 1px solid #222; }
        #preco { font-size: 5em; font-weight: 900; color: var(--success); font-family: monospace; margin: 20px 0; }
        #log { background: #000; padding: 15px; height: 150px; overflow-y: auto; border-radius: 10px; font-size: 12px; font-family: monospace; text-align: left; margin-top: 20px; border: 1px solid #222; }
        .win { color: var(--success); } .loss { color: var(--danger); }
    </style>
</head>
<body>
    <div class="header">
        <img src="/static/logo.jpg" alt="SaaS Logo" style="height:45px" onerror="this.src='https://via.placeholder.com/150x50?text=DragonBot'">
        <div id="status">Servidor: Conectando... 🟡</div>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="input-group"><label>Token API</label><input type="password" id="token"></div>
            <div class="input-group"><label>Stake ($)</label><input type="number" id="stake" value="1.00"></div>
            <div class="input-group"><label>Stop Win</label><input type="number" id="stopwin" value="5.00"></div>
            <div class="input-group"><label>Stop Loss</label><input type="number" id="stoploss" value="10.00"></div>
            <div class="input-group">
                <label>Estratégia</label>
                <select id="estrategia"><option value="martingale">Martingale (2.1x)</option><option value="fixo">Mão Fixa</option></select>
            </div>
            <button class="btn btn-auth" onclick="autenticar()">AUTENTICAR CONTA</button>
            <button id="btnBot" class="btn btn-start" onclick="toggleBot()">LIGAR ROBÔ</button>
        </div>
        <div class="main">
            <div style="background:#0b0e14; padding:20px; border-radius:15px; border:1px solid var(--primary);">
                <small style="color:#888">SALDO ATUAL</small>
                <div id="balance" style="font-size:32px; font-weight:bold; color:var(--primary);">0.00 USD</div>
            </div>
            <div id="preco">0.0000</div>
            <div class="stats-grid">
                <div class="stat-card">WINS: <span id="wins" class="win">0</span></div>
                <div class="stat-card">LOSSES: <span id="losses" class="loss">0</span></div>
                <div class="stat-card" style="grid-column: span 2;">LUCRO: <span id="profit">0.00</span></div>
            </div>
            <div id="log">Aguardando servidor...</div>
        </div>
    </div>
    <script>
        let ws;
        let conectado = false, botLigado = false, operando = false;
        let wins = 0, losses = 0, lucro = 0.0, stakeAtual = 1.0, ultimoId = null;

        function conectar() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onopen = () => { document.getElementById('status').innerHTML = "Servidor: OK 🔵"; };
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if(d.authorize) {
                    conectado = true;
                    document.getElementById('status').innerHTML = "Status: Online 🟢";
                    escreverLog("CONTA CONECTADA!");
                    ws.send(JSON.stringify({action: "watch"}));
                }
                if(d.balance) document.getElementById('balance').innerText = d.balance.balance.toFixed(2) + " USD";
                if(d.tick) {
                    const p = d.tick.quote;
                    document.getElementById('preco').innerText = p;
                    if(botLigado && !operando && p.toString().slice(-1) === "7") fazerEntrada();
                }
                if(d.proposal_open_contract && d.proposal_open_contract.is_completed) {
                    const c = d.proposal_open_contract;
                    if(c.contract_id !== ultimoId) { ultimoId = c.contract_id; processarResultado(c); }
                }
            };
        }
        conectar();
        function autenticar() { ws.send(JSON.stringify({action: "auth", token: document.getElementById('token').value})); }
        function fazerEntrada() {
            const sWin = parseFloat(document.getElementById('stopwin').value);
            const sLoss = parseFloat(document.getElementById('stoploss').value);
            if(lucro >= sWin || lucro <= (sLoss * -1)) { escreverLog("META ATINGIDA!"); toggleBot(); return; }
            operando = true;
            ws.send(JSON.stringify({action: "buy", stake: stakeAtual}));
        }
        function processarResultado(c) {
            const p = parseFloat(c.profit);
            if(p > 0) { wins++; lucro += p; stakeAtual = parseFloat(document.getElementById('stake').value); }
            else { losses++; lucro += p; if(document.getElementById('estrategia').value === "martingale") stakeAtual *= 2.1; }
            document.getElementById('wins').innerText = wins;
            document.getElementById('losses').innerText = losses;
            document.getElementById('profit').innerText = lucro.toFixed(2);
            operando = false;
        }
        function toggleBot() {
            if(!conectado) return alert("Autentique primeiro!");
            botLigado = !botLigado;
            const b = document.getElementById('btnBot');
            b.innerText = botLigado ? "PARAR ROBÔ" : "LIGAR ROBÔ";
            b.classList.toggle('active', botLigado);
            if(botLigado) { stakeAtual = parseFloat(document.getElementById('stake').value); operando = false; }
        }
        function escreverLog(m) { const l = document.getElementById('log'); l.innerHTML = `> ${m}<br>` + l.innerHTML; }
    </script>
</body>
</html>
