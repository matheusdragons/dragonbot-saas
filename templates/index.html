<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DragonBot - Professional Dashboard</title>
    <style>
        :root { --primary: #00d9ff; --success: #00ff88; --danger: #ff4444; --bg: #0b0e14; --card: #161a23; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; }
        .header { height: 70px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid #2d333f; }
        .container { display: flex; gap: 20px; max-width: 1300px; margin: 20px auto; padding: 0 20px; }
        .sidebar { width: 340px; background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #2d333f; height: fit-content; }
        .main { flex: 1; background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #2d333f; text-align: center; }
        
        /* Inputs e Layout */
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0b0e14; color: white; box-sizing: border-box; }
        
        /* Stats */
        .balance-container { background: #0b0e14; padding: 20px; border-radius: 15px; border: 2px solid var(--primary); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .stat-card { background: #1f242e; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        
        /* Botões */
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; transition: 0.3s; }
        .btn-auth { background: var(--primary); color: #000; }
        .btn-start { background: var(--success); color: #000; }
        .btn-start.active { background: var(--danger); color: white; }
        .btn-reset { background: #333; color: #ccc; font-size: 10px; margin-top: 20px; }
        .btn-reset:hover { background: #444; color: #fff; }

        #preco { font-size: 5em; font-weight: 900; color: var(--success); font-family: monospace; margin: 20px 0; }
        #log { background: #000; padding: 15px; height: 180px; overflow-y: auto; border-radius: 10px; font-size: 12px; font-family: monospace; text-align: left; border: 1px solid #222; }
        .win { color: var(--success) !important; font-weight: bold; }
        .loss { color: var(--danger) !important; font-weight: bold; }
    </style>
</head>
<body>
    <header class="header">
        <img src="/static/logo.jpg" alt="Logo" style="height:50px" onerror="this.src='https://via.placeholder.com/150x50?text=DragonBot'">
        <div id="status_display">Status: Servidor OK 🔵</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="input-group"><label>Token API</label><input type="password" id="token_input" placeholder="Insira seu Token"></div>
            <div class="input-group"><label>Stake ($)</label><input type="number" id="stake_input" value="1.00"></div>
            <div class="input-group"><label>Stop Win</label><input type="number" id="stopWin_input" value="5.00"></div>
            <div class="input-group"><label>Stop Loss</label><input type="number" id="stopLoss_input" value="10.00"></div>
            <div class="input-group">
                <label>Estratégia</label>
                <select id="estrategia_input">
                    <option value="martingale">Martingale (2.1x)</option>
                    <option value="fixo">Mão Fixa</option>
                </select>
            </div>
            <button class="btn btn-auth" onclick="autenticar()">AUTENTICAR CONTA</button>
            <button id="btnBot" class="btn btn-start" onclick="toggleBot()">LIGAR ROBÔ</button>
            <button class="btn btn-reset" onclick="resetarEstatisticas()">RESETAR ESTATÍSTICAS / SESSÃO</button>
        </div>

        <div class="main">
            <div class="balance-container">
                <small style="color: #888;">SALDO DISPONÍVEL</small>
                <div id="balance_display" style="font-size: 36px; font-weight: bold; color: var(--primary);">0.00 USD</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div>WINS</div><div id="wins_display" class="win" style="font-size: 24px;">0</div></div>
                <div class="stat-card"><div>LOSSES</div><div id="losses_display" class="loss" style="font-size: 24px;">0</div></div>
            </div>

            <div class="stat-card" style="margin-bottom: 20px;">
                <div>LUCRO ACUMULADO</div>
                <div id="profit_display" style="font-size: 30px; font-weight: bold;">0.00</div>
            </div>

            <div id="preco">0.0000</div>
            <div id="log">Aguardando início...</div>
        </div>
    </div>

    <script>
        let ws;
        let conectado = false, botLigado = false, operando = false;
        let wins = 0, losses = 0, lucroTotal = 0.0, stakeInicial = 1.0, stakeAtual = 1.0;
        let ultimoContratoId = null;

        function conectarWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => { document.getElementById('status_display').innerHTML = "Status: Conectado 🔵"; };

            ws.onmessage = (e) => {
                const res = JSON.parse(e.data);
                
                if (res.authorize) {
                    conectado = true;
                    document.getElementById('status_display').innerHTML = "Status: Online 🟢";
                    escreverLog("CONTA AUTORIZADA COM SUCESSO!");
                    ws.send(JSON.stringify({action: "watch"}));
                }

                if (res.balance) {
                    document.getElementById('balance_display').innerText = res.balance.balance.toFixed(2) + " USD";
                }

                if (res.tick) {
                    const preco = res.tick.quote;
                    document.getElementById('preco').innerText = preco;
                    // Lógica de entrada: Dígito final 7
                    if (botLigado && !operando && preco.toString().slice(-1) === "7") {
                        fazerEntrada();
                    }
                }

                if (res.proposal_open_contract && res.proposal_open_contract.is_completed) {
                    const contrato = res.proposal_open_contract;
                    if (contrato.contract_id !== ultimoContratoId) {
                        ultimoContratoId = contrato.contract_id;
                        processarResultado(contrato);
                    }
                }
            };
        }

        conectarWS();

        function autenticar() {
            const token = document.getElementById('token_input').value;
            if(!token) return alert("Insira o Token!");
            ws.send(JSON.stringify({action: "auth", token: token}));
        }

        function fazerEntrada() {
            const sWin = parseFloat(document.getElementById('stopWin_input').value);
            const sLoss = parseFloat(document.getElementById('stopLoss_input').value);

            if (lucroTotal >= sWin || lucroTotal <= (sLoss * -1)) {
                escreverLog("META ATINGIDA! ROBÔ PARADO.");
                toggleBot();
                return;
            }

            operando = true;
            ws.send(JSON.stringify({action: "buy", stake: stakeAtual}));
            escreverLog(`Entrada enviada: $${stakeAtual.toFixed(2)}`);
        }

        function processarResultado(c) {
            const p = parseFloat(c.profit);
            lucroTotal += p;

            if (p > 0) {
                wins++;
                escreverLog(`<span class="win">VITÓRIA: +$${p.toFixed(2)}</span>`);
                stakeAtual = parseFloat(document.getElementById('stake_input').value);
            } else {
                losses++;
                escreverLog(`<span class="loss">DERROTA: -$${Math.abs(p).toFixed(2)}</span>`);
                if (document.getElementById('estrategia_input').value === "martingale") {
                    stakeAtual *= 2.1;
                }
            }
            
            atualizarPainel();
            operando = false;
        }

        function atualizarPainel() {
            document.getElementById('wins_display').innerText = wins;
            document.getElementById('losses_display').innerText = losses;
            const profDisp = document.getElementById('profit_display');
            profDisp.innerText = lucroTotal.toFixed(2);
            profDisp.className = lucroTotal >= 0 ? "win" : "loss";
        }

        function toggleBot() {
            if (!conectado) return alert("Autentique primeiro!");
            botLigado = !botLigado;
            const btn = document.getElementById('btnBot');
            btn.innerText = botLigado ? "PARAR ROBÔ" : "LIGAR ROBÔ";
            btn.classList.toggle('active', botLigado);
            if (botLigado) {
                stakeAtual = parseFloat(document.getElementById('stake_input').value);
                operando = false;
            }
        }

        function resetarEstatisticas() {
            wins = 0; losses = 0; lucroTotal = 0.0;
            atualizarPainel();
            escreverLog("Estatísticas resetadas.");
        }

        function escreverLog(m) {
            const log = document.getElementById('log');
            log.innerHTML = `<div>> ${m}</div>` + log.innerHTML;
        }
    </script>
</body>
</html>
