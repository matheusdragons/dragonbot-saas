function handleMessage(res) {
    if (res.authorize) {
        conectado = true;
        document.getElementById('status_display').innerHTML = "Status: Online 🟢";
        escreverLog("CONTA CONECTADA! Pronto para operar.");
        
        // Pedir Ticks e Saldo IMEDIATAMENTE após conectar
        ws.send(JSON.stringify({ "ticks": "R_100", "subscribe": 1 }));
        ws.send(JSON.stringify({ "balance": 1, "subscribe": 1 }));
    }

    if (res.balance) {
        document.getElementById('balance_display').innerText = res.balance.balance.toFixed(2) + " USD";
    }

    if (res.tick) {
        let precoS = res.tick.quote.toString();
        let ultimoDigito = precoS.charAt(precoS.length - 1);
        document.getElementById('preco').innerText = res.tick.quote;

        // SE O ROBÔ ESTIVER LIGADO E O DÍGITO FOR 7
        if (roboLigado && !operacaoEmCurso && ultimoDigito === "7") {
            escreverLog("Dígito 7 detectado! Comprando...");
            executarCompra();
        }
    }

    if (res.buy) {
        escreverLog("Ordem aceita pela corretora! ID: " + res.buy.contract_id);
    }

    if (res.proposal_open_contract) {
        let c = res.proposal_open_contract;
        if (c.is_completed) {
            processarResultado(c);
            operacaoEmCurso = false;
        }
    }
}

function executarCompra() {
    operacaoEmCurso = true;
    
    // Configuração da compra DIGITDIFF (Ganha se NÃO for 7)
    const payload = {
        "buy": 1,
        "price": parseFloat(stakeAtual),
        "parameters": {
            "amount": parseFloat(stakeAtual),
            "basis": "stake",
            "contract_type": "DIGITDIFF",
            "currency": "USD",
            "duration": 1,
            "duration_unit": "t",
            "symbol": "R_100",
            "barrier": "7"
        },
        "subscribe": 1
    };
    
    ws.send(JSON.stringify(payload));
}
