<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonBot - O Futuro do Trading Automático</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: white; 
            padding: 50px 20px; 
            margin: 0;
        }
        .container { max-width: 900px; margin: auto; }
        h1 { color: #38bdf8; font-size: 3.5rem; margin-bottom: 10px; }
        p { font-size: 1.3rem; color: #94a3b8; line-height: 1.6; }
        
        .btn-comprar { 
            display: inline-block; 
            padding: 22px 50px; 
            background: #22c55e; 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.6rem; 
            margin-top: 40px;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }
        .btn-comprar:hover { 
            background: #16a34a; 
            transform: scale(1.05);
        }
        
        .login-link { 
            display: block; 
            margin-top: 25px; 
            color: #38bdf8; 
            text-decoration: none; 
            font-size: 1.1rem;
        }
        .login-link:hover { text-decoration: underline; }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DragonBot 🐉</h1>
        <p>Acesse a inteligência artificial que automatiza suas operações com alta precisão e segurança 24 horas por dia.</p>
        
        <a href="https://pay.kirvano.com/dbf3105c-7f6d-4bc4-95bc-4483647cd351" class="btn-comprar">ASSINAR AGORA</a>
        
        <a href="/login" class="login-link">Já possui uma licença? Entrar no Painel</a>

        <div class="features">
            <div class="card">🚀 Alta Velocidade</div>
            <div class="card">🛡️ 100% Seguro</div>
            <div class="card">📊 Relatórios em Tempo Real</div>
        </div>
    </div>
</body>
</html>
