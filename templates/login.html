<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Dragon Bot</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161a23; padding: 40px; border-radius: 20px; border: 1px solid #2d333f; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #0b0e14; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #00d9ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar no Painel</h2>
        <p style="font-size: 12px; color: #888;">Use o e-mail da compra. Senha padrão: dragon123</p>
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button type="submit">ACESSAR SISTEMA</button>
        </form>
    </div>
</body>
</html>
