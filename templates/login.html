<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DragonBot SaaS</title>
    <style>
        :root { --primary: #00d9ff; --bg: #0b0e14; --card: #161a23; --text: #ffffff; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
        }
        
        .login-card {
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #2d333f;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-card img { height: 60px; margin-bottom: 20px; }
        .login-card h2 { margin-bottom: 10px; font-size: 24px; }
        .login-card p { color: #888; font-size: 14px; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #0b0e14; 
            color: white; 
            box-sizing: border-box; 
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(0, 217, 255, 0.2); }

        .btn-entrar { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: #000; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            margin-top: 10px;
        }

        .links { margin-top: 25px; font-size: 13px; }
        .links a { color: var(--primary); text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/static/logo.jpg" alt="DragonBot">
        <h2>Bem-vindo de volta!</h2>
        <p>Acesse sua conta para operar.</p>

        <form action="/auth" method="POST">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-entrar">ENTRAR NO PAINEL</button>
        </form>

        <div class="links">
            Ainda não tem conta? <a href="/#planos">Assine agora</a>
        </div>
    </div>

</body>
</html>
