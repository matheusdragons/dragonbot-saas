<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dragon Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root { 
            --primary: #00d9ff; 
            --success: #00ff88; 
            --danger: #ff4757;
            --bg: #0b0e14;
            --bg-secondary: #161a23;
        }

        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVEGAÇÃO */
        nav { 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            box-shadow: 0 2px 10px rgba(0, 217, 255, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-btn {
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            font-size: 14px;
            color: var(--primary);
            background: transparent;
            border: 2px solid var(--primary);
        }

        .nav-btn:hover {
            background: var(--primary);
            color: black;
        }

        /* CONTAINER PRINCIPAL */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.03), rgba(0, 255, 136, 0.03));
        }

        /* CARD DE LOGIN */
        .login-card {
            background: var(--bg-secondary);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 217, 255, 0.2);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            margin-bottom: 25px;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }

        /* FORMULÁRIO */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg);
            border: 2px solid #2d333f;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #555;
        }

        /* BOTÃO DE LOGIN */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #0099ff);
            border: none;
            border-radius: 10px;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* MENSAGEM DE ERRO */
        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        /* INFO BOX */
        .info-box {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            text-align: center;
        }

        .info-box p {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        .info-box a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        /* FOOTER DO CARD */
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #2d333f;
        }

        .login-footer p {
            color: #666;
            font-size: 13px;
        }

        .login-footer a {
            color: var(--success);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVO */
        @media (max-width: 480px) {
            nav {
                padding: 15px 20px;
            }

            .login-card {
                padding: 40px 25px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-logo svg {
                width: 180px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <!-- NAVEGAÇÃO -->
    <nav>
        <a href="/" class="nav-brand">
            <!-- LOGO NAVBAR -->
            <svg width="180" height="45" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="gradNav" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
                    </linearGradient>
                </defs>
                
                <!-- Ícone D + Candlesticks -->
                <g transform="translate(5, 10)">
                    <path d="M 0 15 L 0 0 L 15 0 Q 30 0, 30 15 Q 30 30, 15 30 L 0 30 Z" 
                          stroke="url(#gradNav)" stroke-width="2.5" fill="none"/>
                    <rect x="8" y="12" width="3" height="10" fill="#00ff88"/>
                    <line x1="9.5" y1="10" x2="9.5" y2="24" stroke="#00ff88" stroke-width="1"/>
                    <rect x="14" y="8" width="3" height="12" fill="#00d9ff"/>
                    <line x1="15.5" y1="6" x2="15.5" y2="22" stroke="#00d9ff" stroke-width="1"/>
                    <rect x="20" y="5" width="3" height="14" fill="#00ff88"/>
                    <line x1="21.5" y1="3" x2="21.5" y2="21" stroke="#00ff88" stroke-width="1"/>
                </g>
                
                <!-- Texto -->
                <text x="45" y="32" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="#ffffff">DRAGON</text>
                <text x="125" y="32" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="url(#gradNav)">BOT</text>
            </svg>
        </a>
        <a href="/" class="nav-btn">← Voltar</a>
    </nav>

    <!-- CONTAINER DE LOGIN -->
    <div class="login-container">
        <div class="login-card">
            <!-- HEADER COM LOGO -->
            <div class="login-header">
                <div class="login-logo">
                    <!-- LOGO NO CARD -->
                    <svg width="220" height="55" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
                            </linearGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Ícone D + Candlesticks com Glow -->
                        <g transform="translate(5, 10)" filter="url(#glow)">
                            <path d="M 0 15 L 0 0 L 15 0 Q 30 0, 30 15 Q 30 30, 15 30 L 0 30 Z" 
                                  stroke="url(#gradLogin)" stroke-width="2.5" fill="none"/>
                            <rect x="8" y="12" width="3" height="10" fill="#00ff88"/>
                            <line x1="9.5" y1="10" x2="9.5" y2="24" stroke="#00ff88" stroke-width="1"/>
                            <rect x="14" y="8" width="3" height="12" fill="#00d9ff"/>
                            <line x1="15.5" y1="6" x2="15.5" y2="22" stroke="#00d9ff" stroke-width="1"/>
                            <rect x="20" y="5" width="3" height="14" fill="#00ff88"/>
                            <line x1="21.5" y1="3" x2="21.5" y2="21" stroke="#00ff88" stroke-width="1"/>
                        </g>
                        
                        <!-- Texto -->
                        <text x="45" y="32" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="#ffffff">DRAGON</text>
                        <text x="125" y="32" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="url(#gradLogin)">BOT</text>
                    </svg>
                </div>
                <h1>Acessar Painel</h1>
                <p>Entre com seu e-mail de compra e sua senha padrão para acessar o robô.</p>
            </div>

            <!-- MENSAGEM DE ERRO (se houver) -->
            {% if erro %}
            <div class="error-message">
                {{ erro }}
            </div>
            {% endif %}

            <!-- FORMULÁRIO -->
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="email">E-mail de Compra</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Digite o e-mail usado na compra"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha Padrão</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Digite sua senha padrão"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-btn">ENTRAR NO PAINEL</button>
            </form>

            <!-- INFO BOX -->
            <div class="info-box">
                <p>Sua senha padrão foi enviada para o e-mail de compra. Caso não tenha recebido, verifique sua caixa de spam ou <a href="mailto:suporte@dragonbot.com">entre em contato</a>.</p>
            </div>

            <!-- FOOTER DO CARD -->
            <div class="login-footer">
                <p>Ainda não tem acesso? <a href="/#planos">Assine agora</a></p>
            </div>
        </div>
    </div>
</body>
</html>
