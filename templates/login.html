<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Dragon Bot</title>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161a23; padding: 40px; border-radius: 15px; border: 1px solid #2d333f; width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #0b0e14; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #00d9ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Acessar Conta</h2>
        <input type="email" placeholder="Seu E-mail">
        <input type="password" placeholder="Sua Senha">
        <button onclick="window.location.href='/dashboard'">ENTRAR</button>
    </div>
</body>
</html>
