<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Bot - O Futuro do Trading</title>
    <style>
        :root { --primary: #00d9ff; --success: #00ff88; --bg: #0b0e14; --card: #161a23; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        nav { padding: 30px 0; display: flex; justify-content: space-between; align-items: center; }
        .hero { padding: 80px 0; }
        h1 { font-size: 48px; margin-bottom: 20px; }
        h1 span { color: var(--primary); }
        p { color: #888; font-size: 18px; margin-bottom: 40px; }
        .cta-button { 
            background: var(--success); color: black; padding: 20px 40px; 
            text-decoration: none; font-weight: bold; border-radius: 50px; 
            font-size: 20px; box-shadow: 0 10px 20px rgba(0,255,136,0.3);
            display: inline-block; transition: 0.3s;
        }
        .cta-button:hover { transform: translateY(-5px); }
        .login-link { color: white; text-decoration: none; border: 1px solid var(--primary); padding: 10px 25px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div style="font-size: 24px; font-weight: bold;">DRAGON<span style="color:var(--primary)">BOT</span></div>
            <a href="/login" class="login-link">Acessar Painel</a>
        </nav>
        <section class="hero">
            <h1>Opere no Automático com <br><span>Inteligência Artificial</span></h1>
            <p>A ferramenta definitiva para análise de padrões na Deriv. <br> Lucros consistentes com gestão de risco profissional.</p>
            <a href="#" class="cta-button">QUERO ACESSO IMEDIATO</a>
        </section>
    </div>
</body>
</html>
