<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Bot - Inteligência em Trading</title>
    <style>
        :root { --primary: #00d9ff; --success: #00ff88; --bg: #0b0e14; --card: #161a23; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; text-align: center; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        nav { padding: 30px 0; display: flex; justify-content: space-between; align-items: center; }
        .hero { padding: 100px 0; }
        h1 { font-size: 50px; margin-bottom: 20px; line-height: 1.2; }
        h1 span { color: var(--primary); }
        .subtitle { color: #888; font-size: 20px; margin-bottom: 50px; max-width: 800px; margin-inline: auto; }
        .cta-button { 
            background: var(--success); color: black; padding: 22px 50px; 
            text-decoration: none; font-weight: 800; border-radius: 50px; 
            font-size: 22px; box-shadow: 0 10px 30px rgba(0,255,136,0.3);
            display: inline-block; transition: 0.3s;
        }
        .cta-button:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0,255,136,0.5); }
        .login-btn { color: white; text-decoration: none; border: 1px solid var(--primary); padding: 10px 25px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div style="font-size: 28px; font-weight: 900; letter-spacing: -1px;">DRAGON<span style="color:var(--primary)">BOT</span></div>

        <section class="hero">

            <p class="subtitle">A ferramenta definitiva para análise de padrões de dígitos. Gestão profissional e entradas automáticas direto na sua conta.</p>
            <a href="https://pay.kirvano.com/dbf3105c-7f6d-4bc4-95bc-4483647cd351" class="cta-button">GARANTIR MEU ACESSO AGORA</a>
        </section>
    </div>
</body>
</html>
